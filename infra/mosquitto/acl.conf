# ACL tối thiểu theo dịch vụ. Người dùng không được liệt kê = không có quyền gì.
# Chủ đề dùng chung: zigbee2mqtt/<tên thiết bị>[/set|/get|/availability], zigbee2mqtt/bridge/*

# Zigbee2MQTT thật (và simulator giả lập nó): toàn quyền trên cây của mình.
user z2m
topic readwrite zigbee2mqtt/#

# Gateway agent: chỉ đọc trạng thái, chỉ được GỬI LỆNH điều khiển (…/set). Không đọc/ghi gì khác.
user gateway
topic read zigbee2mqtt/#
topic write zigbee2mqtt/+/set

# Matterbridge (plugin zigbee2mqtt): đọc trạng thái và điều khiển. Mình chưa thể kiểm chứng plugin ghi những topic
# nào khi có Home app điều khiển (cần Pi + bộ điều khiển Matter thật), nên cấp rộng trên cây zigbee2mqtt/ — nếu
# thu hẹp thì phải thử lại điều khiển từ Apple/Google Home.
user matterbridge
topic readwrite zigbee2mqtt/#
