# Giữ bản tin retained (bridge/devices, bridge/info… của Zigbee2MQTT) qua các lần khởi động lại, nhưng KHÔNG ghi định kỳ
# lên thẻ nhớ: autosave_interval 0 = chỉ lưu khi broker dừng (hoặc nhận SIGUSR1). Broker chết đột ngột thì mất retained
# tới khi Zigbee2MQTT publish lại (khởi động lại zigbee2mqtt nếu gateway thiếu danh sách thiết bị).
persistence true
persistence_location /mosquitto/data/
autosave_interval 0

# Log chỉ ra stdout (không ghi file). Trên Pi, Docker không lưu log container (logging driver none).
log_dest stdout
log_type error
log_type warning

# Bắt buộc đăng nhập + ACL theo từng dịch vụ (xem acl.conf). File mật khẩu do entrypoint.sh tạo mỗi lần khởi động
# từ biến môi trường MQTT_PASSWORD_* nên không có mật khẩu nào nằm trong repo.
listener 1883
allow_anonymous false
password_file /tmp/mosquitto-passwd
acl_file /mosquitto/config/acl.conf
