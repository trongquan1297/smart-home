[package]
name = "msmart-addon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# Addon trong nhà duy nhất của MSmart: mọi thiết bị không đi qua Zigbee, một container, một token gateway.
# Camera Wi‑Fi (go2rtc + ONVIF) và máy lọc nước Karofi (Bluetooth LE qua BlueZ/btleplug); thêm loại mới: xem src/main.rs.
# go2rtc lo hình ảnh (WebRTC, ảnh chụp); addon lo ONVIF (tìm camera, PTZ, sự kiện chuyển động) và lưu mật khẩu camera tại chỗ.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
btleplug = "0.11"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
