# Addon trong nhà DUY NHẤT của MSmart (msmart-addon + go2rtc): mọi thiết bị không đi qua Zigbee, một container, một token.
#   Hiện có: camera Wi‑Fi (ONVIF/RTSP) và máy lọc nước Karofi (Bluetooth). Bật/tắt từng loại: ADDON_DEVICES=camera,purifier.
# Chạy trên một máy Linux cùng mạng LAN với camera và trong tầm Bluetooth (~10 m) của máy lọc (Raspberry Pi, mini PC…).
# Độc lập với Zigbee: có thể chạy trên chính Pi đang chạy gateway Zigbee hoặc máy khác.
# Cần Linux + network_mode: host (tìm camera bằng multicast ONVIF và WebRTC tới điện thoại).
#
#   1. Trong app: Bộ điều khiển trung tâm → Thêm → đặt tên (vd "Addon") → sao chép token.
#   2. Trên máy đó, ghi CLOUD_WS_URL=wss://<backend>/gw/ws và GATEWAY_TOKEN=<token> vào edge/.env.addon (chmod 600), rồi
#        docker compose --env-file .env.addon -f docker-compose.addon.yml up -d --build
#   3. Trong app: mở căn hộ → Camera → Thêm camera (bật ONVIF và tạo tài khoản camera trong app của hãng trước).
# Xem từ xa mượt hơn khi router chuyển tiếp cổng 8555 (UDP+TCP) về máy này; không bắt buộc.
# Máy lọc nước: máy chủ cần BlueZ đang chạy và Bluetooth không bị chặn (`sudo rfkill unblock bluetooth`);
#   addon nói chuyện với BlueZ qua D-Bus hệ thống (mount /run/dbus bên dưới). Trong app: + → Máy lọc nước.
name: msmart-addon

# Không lưu log container, /tmp trong RAM: giảm ghi thẻ nhớ (gỡ lỗi: DOCKER_LOG_DRIVER=local docker compose ... up -d).
x-logging: &logging
  driver: ${DOCKER_LOG_DRIVER:-none}
x-tmpfs: &tmpfs
  - /tmp:size=16m,mode=1777

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    restart: unless-stopped
    logging: *logging
    tmpfs: *tmpfs
    network_mode: host
    volumes:
      - ../addons/msmart/go2rtc.yaml:/config/go2rtc.yaml:ro

  addon:
    image: ${ADDON_IMAGE:-smarthome-addon:local}
    build: ../addons/msmart
    restart: unless-stopped
    logging: *logging
    tmpfs: *tmpfs
    network_mode: host
    # dbus-daemon của máy chủ từ chối uid không có trong /etc/passwd CỦA MÁY CHỦ ("Did not receive a reply"),
    # nên không chạy bằng uid 10001 của image mà bằng nobody (65534, máy Linux nào cũng có) để dùng được Bluetooth.
    # Image cũng chạy bằng 65534; volume tạo bởi bản cũ (chủ 10001) thì chown một lần, xem README mục addon.
    user: "65534:65534"
    environment:
      CLOUD_WS_URL: ${CLOUD_WS_URL:?set CLOUD_WS_URL, vd wss://api.example.com/gw/ws}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN}
      GO2RTC_URL: http://127.0.0.1:1984
      RUST_LOG: warn
      ADDON_DEVICES: ${ADDON_DEVICES:-camera,purifier} # loại thiết bị addon phụ trách
      PURIFIER_POLL_SECS: ${PURIFIER_POLL_SECS:-60} # chu kỳ đọc máy lọc nước (giây)
    volumes:
      - addon-data:/data # mật khẩu camera, danh sách máy lọc…: chỉ lưu ở đây
      - /run/dbus:/run/dbus:ro # Bluetooth (BlueZ) cho máy lọc nước
    depends_on: [go2rtc]

volumes:
  addon-data:
