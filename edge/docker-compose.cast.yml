# Gateway CHỈ làm loa Cast (Google Home / Nest Mini…): chạy trên một máy Linux nằm cùng mạng LAN/Wi‑Fi với loa
# (Raspberry Pi, NAS, mini PC…). Dùng khi backend chạy trên đám mây/máy chủ — máy chủ đó không thấy được loa trong nhà.
# Không cần Zigbee2MQTT/Mosquitto. Cần Linux (network_mode: host để quét mDNS; Docker Desktop trên Mac/Windows không đủ).
#
#   1. Trong app: Bộ điều khiển trung tâm → Thêm → đặt tên (vd "Loa phòng khách") → sao chép token.
#   2. Trên máy đó:  CLOUD_WS_URL=ws://<địa-chỉ-backend>:18080/gw/ws GATEWAY_TOKEN=<token> docker compose -f docker-compose.cast.yml up -d --build
#   3. Trong app: ⋮ → Loa thông báo → Thêm loa.
# Máy này phải cho loa truy cập cổng HTTP CAST_HTTP_PORT (mặc định 8765) — kiểm tra tường lửa.
name: smarthome-cast

services:
  gateway:
    build: ../gateway
    restart: unless-stopped
    network_mode: host
    environment:
      MQTT_DISABLED: "1"
      CLOUD_WS_URL: ${CLOUD_WS_URL:?set CLOUD_WS_URL, vd ws://10.0.0.5:18080/gw/ws}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN}
      # CAST_HTTP_PORT: "8765"
      # CAST_ADVERTISE_HOST: 192.168.1.10
      # TTS_URL_TEMPLATE: https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q={text}
      RUST_LOG: info
