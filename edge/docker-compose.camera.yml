# Addon camera Wi‑Fi (go2rtc + msmart-camera): chạy trên một máy Linux cùng mạng LAN với camera (Raspberry Pi, NAS, mini PC…).
# Độc lập với Zigbee: có thể chạy trên chính Pi đang chạy gateway Zigbee hoặc máy khác.
# Cần Linux + network_mode: host (tìm camera bằng multicast ONVIF và WebRTC tới điện thoại).
#
#   1. Trong app: Bộ điều khiển trung tâm → Thêm → đặt tên (vd "Camera") → sao chép token.
#   2. Trên máy đó:  CLOUD_WS_URL=wss://<backend>/gw/ws GATEWAY_TOKEN=<token> docker compose -f docker-compose.camera.yml up -d --build
#   3. Trong app: mở căn hộ → Camera → Thêm camera (bật ONVIF và tạo tài khoản camera trong app của hãng trước).
# Xem từ xa mượt hơn khi router chuyển tiếp cổng 8555 (UDP+TCP) về máy này; không bắt buộc.
name: smarthome-camera

# Không lưu log container, /tmp trong RAM: giảm ghi thẻ nhớ (gỡ lỗi: DOCKER_LOG_DRIVER=local docker compose ... up -d).
x-logging: &logging
  driver: ${DOCKER_LOG_DRIVER:-none}
x-tmpfs: &tmpfs
  - /tmp:size=16m,mode=1777

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    restart: unless-stopped
    logging: *logging
    tmpfs: *tmpfs
    network_mode: host
    volumes:
      - ../addons/camera/go2rtc.yaml:/config/go2rtc.yaml:ro

  camera-addon:
    image: ${CAMERA_ADDON_IMAGE:-smarthome-camera-addon:local}
    build: ../addons/camera
    restart: unless-stopped
    logging: *logging
    tmpfs: *tmpfs
    network_mode: host
    environment:
      CLOUD_WS_URL: ${CLOUD_WS_URL:?set CLOUD_WS_URL, vd wss://api.example.com/gw/ws}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN}
      GO2RTC_URL: http://127.0.0.1:1984
      RUST_LOG: warn
    volumes:
      - camera-data:/data # mật khẩu camera: chỉ lưu ở đây
    depends_on: [go2rtc]

volumes:
  camera-data:
